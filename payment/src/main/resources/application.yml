spring:
  application:
    name: payment
  task:
    scheduling:
      pool:
        # 기본값 1이면 @Scheduled 6개가 한 스레드를 공유해, 느린 틱 하나가 나머지를 전부 막는다.
        # (예: 카드사가 응답을 안 주면 inquiry 한 틱이 300건 x 3s socket timeout까지 늘어지고
        #  그동안 웹훅 배달도 잔액 플러시도 정지한다.)
        # 스케줄 메서드 수(7) + 여유. 서로 다른 스케줄러만 겹치고, 같은 메서드는
        # ScheduledThreadPoolExecutor가 여전히 자기 자신과 겹치지 않게 보장한다.
        size: 8
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:payment-mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:payment}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:payment}
    password: ${MYSQL_PASSWORD:payment}
    hikari:
      maximum-pool-size: 20 # core * 2 경험식 (노트북 8~12코어 기준), 기본값(10)에서 상향
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 500
        order_inserts: true

# 카드사별 장애 격리. 인스턴스는 CardCompany 이름으로 런타임에 만들어지고
# (CardClient가 레지스트리에서 직접 꺼낸다) 여기 default 설정을 물려받는다.
resilience4j:
  bulkhead:
    configs:
      default:
        # 커넥션 풀(maxConnPerRoute 64)보다 반드시 낮아야 한다. 그래야 초과분이 전부
        # 여기서 즉시 거절되고, 풀에서 500ms를 버린 뒤 ConnectionRequestTimeout이 나는 일이
        # 구조적으로 사라진다. 풀은 "여기서 막히면 안 되는" 물리적 상한으로만 남는다.
        # 환경변수로 뺀 이유는 격리 A/B 측정 때문이다. 아주 크게 주면 사실상 꺼진다.
        # 48은 건강한 카드사의 피크 동시성(실측 48~64) 한가운데라 멀쩡한 결제를 죽였다:
        # 단일 카드사 150 TPS에서 3,608건이 BulkheadFullException으로 확정 실패했고
        # 완주율이 72.2% -> 55.8%로 떨어졌다(이론 상한 72.0%).
        # 80은 그 위여서 건강할 때 거절이 2건(0.01%)뿐이고, 아픈 카드사는 그대로 막는다.
        # 커넥션 풀(route당 128)보다는 여전히 낮게 유지해야 한다.
        maxConcurrentCalls: ${CARD_BULKHEAD_MAX:80}
        # 대기 금지. 퍼밋을 기다리면 지키려던 그 Tomcat 스레드를 그대로 붙잡고 있게 된다.
        maxWaitDuration: 0
  circuitbreaker:
    configs:
      default:
        # 초당 100건 넘게 도는 대상이라 "최근 N초"로 세는 게 의미에 맞다.
        slidingWindowType: TIME_BASED
        slidingWindowSize: 10
        # 20은 너무 예민하다 — 회사당 100 calls/s면 0.2초치 표본이라, 기동 직후 버스트처럼
        # "성공이 아직 하나도 안 돌아온" 순간에 실패율이 진짜 100%가 되어 서킷이 열린다.
        # 100이면 약 1초치라 여전히 빠르게 반응하면서 그 함정을 피한다.
        # (아주 크게 주면 창이 절대 안 차서 서킷이 사실상 꺼진다 — 격리 A/B 측정용)
        minimumNumberOfCalls: ${CARD_CB_MIN_CALLS:100}
        # 카오스 테스트의 단계당 장애율(10.4%)과 충분히 떨어뜨린다. 그 근처로 잡으면
        # 양쪽 카드사가 동시에 차단되면서 부하가 통째로 죽는다.
        # 100으로 주면 "전부 실패해야 열림" = 사실상 꺼짐 (격리 A/B 측정용).
        failureRateThreshold: ${CARD_CB_FAILURE_RATE:50}
        # 느린 호출 감지가 실패율보다 중요하다. SLOW_SUCCESS로 느려진 카드사는 실패를
        # 내지 않고 성공하면서 스레드만 먹으므로, 실패율만 보면 영영 안 열린다.
        # 정상 20ms / 소켓 타임아웃 3s 사이에 문턱을 둔다.
        # 소켓 타임아웃(3s)보다 크게 주면 어떤 호출도 "느림"으로 안 잡혀 이 판정이 꺼진다.
        # 비율만 100으로 올리는 건 비활성화가 아니다 — 전부 느린 상황에서는 그대로 열린다.
        slowCallDurationThreshold: ${CARD_CB_SLOW_DURATION:1s}
        slowCallRateThreshold: ${CARD_CB_SLOW_RATE:50}
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 10
        # 트래픽이 없어도 스스로 half-open으로 넘어가 회복을 탐침한다.
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        # 4xx는 카드사가 건강하게 거절한 것이다. 이걸 실패로 세면 거절이 많은 가맹점 하나가
        # 서킷을 열어 정상 결제까지 막는다.
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
          - io.github.resilience4j.bulkhead.BulkheadFullException

payment:
  card:
    card-a-base-url: ${CARD_A_BASE_URL:http://card:8080}
    card-b-base-url: ${CARD_B_BASE_URL:http://card-b:8080}
    # 카드사 한 곳당 커넥션 상한. Bulkhead 퍼밋보다 반드시 커야 한다
    # (이유는 CardClientConfig 주석 참고). 퍼밋을 올리는 A/B 측정에서 함께 올린다.
    max-conn-per-route: ${CARD_MAX_CONN_PER_ROUTE:128}
    max-conn-total: ${CARD_MAX_CONN_TOTAL:256}
    # true면 카드사들이 커넥션 풀 하나를 공유하고 per-route 상한도 사라진다 —
    # 한 카드사가 풀을 통째로 삼킬 수 있는 상태, 즉 **격리 이전의 모습**이다.
    # 장애 전파를 관측하기 위한 측정 전용 스위치이며 운영 기본값은 false다.
    shared-pool: ${CARD_SHARED_POOL:false}
  ledger:
    # 매입 기표가 계정 잔액을 언제 반영하는가. 측정용 스위치다 (LedgerBalanceMode 참고).
    #   SNAPSHOT  원장 entry만 INSERT, 잔액은 AccountBalanceFlusher가 갱신 — 운영 기본값
    #   INLINE    기표와 같은 트랜잭션에서 UPDATE — 글로벌 계정 한 행에 매입이 직렬화된다
    #   SHARDED   INLINE과 같되 글로벌 계정을 16버킷으로 쪼갠다
    balance-mode: ${LEDGER_BALANCE_MODE:SNAPSHOT}
    # V36이 만들어 둔 샤드 행 수와 반드시 같아야 한다. 올리면 없는 샤드를 찾다가 터진다.
    shard-count: ${LEDGER_SHARD_COUNT:16}
  fds:
    base-url: ${FDS_BASE_URL:http://fds:8080}
  webhook:
    merchant-base-url: ${MERCHANT_BASE_URL:http://merchant:8080}
  expiry:
    # 인증까지 끝난 결제가 승인 요청을 기다려주는 시간. 실제 결제창 세션 수명(10~15분)에 맞춘다.
    # 이 시간이 지나면 EXPIRED가 되고, 이후 승인 요청은 422로 거절된다.
    # 카드사에 알릴 것은 없다 — 인증은 한도를 잡지 않는다.
    fds-passed-ttl-ms: ${EXPIRY_FDS_PASSED_TTL_MS:900000}
    # "승인 요청이 안 왔다"를 알려주는 이벤트가 없어 주기 스캔이 유일한 발견 수단이다.
    scan-interval-ms: ${EXPIRY_SCAN_INTERVAL_MS:60000}
