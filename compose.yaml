services:
  merchant:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: merchant
    container_name: merchant
    ports:
      - "8081:8080"
    depends_on:
      - payment

  payment:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment
    container_name: payment
    ports:
      - "8082:8080"
    environment:
      MYSQL_HOST: payment-mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: payment
      MYSQL_USER: payment
      MYSQL_PASSWORD: payment
      CARD_BASE_URL: http://card:8080
      FDS_BASE_URL: http://fds:8080
    depends_on:
      payment-mysql:
        condition: service_healthy
      fds:
        condition: service_started
      card:
        condition: service_started

  fds:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: fds
    container_name: fds
    ports:
      - "8083:8080"
    environment:
      MYSQL_HOST: fds-mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: fds
      MYSQL_USER: fds
      MYSQL_PASSWORD: fds
    depends_on:
      fds-mysql:
        condition: service_healthy

  card:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: card
    container_name: card
    ports:
      - "8084:8080"
    environment:
      MYSQL_HOST: card-mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: card
      MYSQL_USER: card
      MYSQL_PASSWORD: card
    depends_on:
      card-mysql:
        condition: service_healthy

  payment-mysql:
    image: mysql:8.4
    container_name: payment-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: payment
      MYSQL_USER: payment
      MYSQL_PASSWORD: payment
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upayment", "-ppayment"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - payment-mysql-data:/var/lib/mysql

  card-mysql:
    image: mysql:8.4
    container_name: card-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: card
      MYSQL_USER: card
      MYSQL_PASSWORD: card
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucard", "-pcard"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - card-mysql-data:/var/lib/mysql

  fds-mysql:
    image: mysql:8.4
    container_name: fds-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: fds
      MYSQL_USER: fds
      MYSQL_PASSWORD: fds
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufds", "-pfds"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - fds-mysql-data:/var/lib/mysql

volumes:
  payment-mysql-data:
  card-mysql-data:
  fds-mysql-data:
